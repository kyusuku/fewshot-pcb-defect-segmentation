# Copy this file to configs/paths.local.yaml or pass --root to scripts.
# Raw datasets should stay outside git.

data:
  visa_root: data/processed/VisA_pytorch/1cls
  # Optional official one-class split CSV. Leave null to scan the directory tree.
  visa_manifest_csv: null

  # DeepPCB root usually points at the PCBData directory.
  deeppcb_root: data/raw/DeepPCB-master/PCBData
  deeppcb_train_list: data/raw/DeepPCB-master/PCBData/trainval.txt
  deeppcb_test_list: data/raw/DeepPCB-master/PCBData/test.txt

outputs_dir: outputs
