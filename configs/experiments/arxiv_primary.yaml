name: arxiv_primary
manifest: data/manifests/visa_pcb_folds.csv
fold_id: 0
categories: [pcb1, pcb2, pcb3, pcb4]
shots: [1, 2, 4]
seeds: [4880, 4881, 4882, 4883, 4884]
methods:
  - patchcore
  - dinov2_single
  - dinov2_multi
  - sam2_only
  - dinov2_single_sam2
  - dinov2_multi_sam2
  - anomaly_consistent_sam2
dinov2:
  backbone: dinov2_vits14
  image_size: 518
  patch_size: 14
multi_scale:
  crop_sizes: [768]
  crop_overlap: 0.25
  fusion: max
calibration:
  quantile: 0.995
sam2:
  refiner: sam2
  checkpoint: weights/sam2.1_hiera_tiny.pt
  model_config: configs/sam2.1/sam2.1_hiera_t.yaml
  prompt_mode: point_box
  point_mode: anomaly_max
  max_mask_area_fraction: 0.25
patchcore:
  backbone: wide_resnet50_2
  weights: IMAGENET1K_V2
  source: torchvision
  layers: [layer2, layer3]
  image_size: 512
  patch_size: 8
  coreset_ratio: 0.01
  projection_dim: 64
  normalization: imagenet
  seed_policy: run_seed
sam2_only:
  refiner: sam2
  query_policy: full_test
  query_fold_split: test
  limit: null
  prompt_longest_side: 1024
  grid_size: 3
  max_regions: 9
  box_scale: 1.0
  max_mask_area_fraction: 0.25
  checkpoint: weights/sam2.1_hiera_tiny.pt
  model_config: configs/sam2.1/sam2.1_hiera_t.yaml
  device: auto
