name: arxiv_smoke
manifest: data/manifests/visa_pcb_folds.csv
fold_id: 0
categories: [pcb1]
shots: [1]
seeds: [4880]
methods:
  - dinov2_single
  - dinov2_multi
  - dinov2_multi_sam2
  - anomaly_consistent_sam2
dinov2:
  backbone: color_patch
  image_size: 56
  patch_size: 14
multi_scale:
  crop_sizes: [32]
  crop_overlap: 0.25
  fusion: max
calibration:
  quantile: 0.995
sam2:
  refiner: fallback
  prompt_mode: point_box
  point_mode: anomaly_max
  max_mask_area_fraction: 0.25
patchcore:
  backbone: wide_resnet50_2
  weights: IMAGENET1K_V2
  source: torchvision
  layers: [layer2, layer3]
  image_size: 512
  patch_size: 8
  coreset_ratio: 0.01
  projection_dim: 64
  normalization: imagenet
  seed_policy: run_seed
sam2_only:
  refiner: fallback
  query_policy: bounded_fixture
  query_fold_split: test
  limit: 2
  prompt_longest_side: 56
  grid_size: 2
  max_regions: 4
  box_scale: 1.0
  max_mask_area_fraction: null
  fallback_threshold_fraction: 0.5
  device: cpu
